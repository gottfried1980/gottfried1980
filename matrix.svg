<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%" style="background: #000;">
  <style>
    @keyframes matrix-rain {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    @keyframes pulse-light {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes oracle-sign-glow {
      0%, 100% { opacity: 0.15; filter: drop-shadow(0px 0px 2px #005f0c); }
      40%, 60% { opacity: 0.95; filter: drop-shadow(0px 0px 12px #00ff33) drop-shadow(0px 0px 25px #008f11); fill: #10ff40; }
      50% { opacity: 1; fill: #a3ffb4; filter: drop-shadow(0px 0px 20px #00ff33); }
      85% { opacity: 0.05; }
    }
    .glow {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 20px;
      fill: #00ff33;
      filter: drop-shadow(0px 0px 4px #00ff33);
    }
    .stream {
      animation: matrix-rain linear infinite;
    }
    .bright {
      fill: #bcffca;
      filter: drop-shadow(0px 0px 8px #fff);
      animation: pulse-light 0.5s infinite;
    }
    .oracle-text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: 6px;
      fill: #008f11;
      text-anchor: middle;
      animation: oracle-sign-glow 8s infinite ease-in-out;
    }
  </style>

  <!-- Reihe 1 -->
  <g class="stream" style="animation-duration: 4.5s; animation-delay: 0s;">
    <text x="40" y="40" class="glow" opacity="0.3">ｦ</text>
    <text x="40" y="70" class="glow" opacity="0.5">ｱ</text>
    <text x="40" y="100" class="glow" opacity="0.7">ｳ</text>
    <text x="40" y="130" class="glow" opacity="0.9">ｴ</text>
    <text x="40" y="160" class="glow bright">ｵ</text>
  </g>

  <g class="stream" style="animation-duration: 3.2s; animation-delay: 1.5s;">
    <text x="120" y="20" class="glow" opacity="0.4">ｶ</text>
    <text x="120" y="50" class="glow" opacity="0.6">ｷ</text>
    <text x="120" y="80" class="glow" opacity="0.8">ｹ</text>
    <text x="120" y="110" class="glow bright">ｺ</text>
  </g>

  <g class="stream" style="animation-duration: 5.8s; animation-delay: 0.7s;">
    <text x="200" y="60" class="glow" opacity="0.3">ｻ</text>
    <text x="200" y="90" class="glow" opacity="0.5">ｼ</text>
    <text x="200" y="120" class="glow" opacity="0.8">ｽ</text>
    <text x="200" y="150" class="glow bright">ｾ</text>
  </g>

  <g class="stream" style="animation-duration: 3.8s; animation-delay: 2.2s;">
    <text x="280" y="10" class="glow" opacity="0.5">ﾀ</text>
    <text x="280" y="40" class="glow" opacity="0.7">ﾁ</text>
    <text x="280" y="70" class="glow" opacity="0.9">ﾂ</text>
    <text x="280" y="100" class="glow bright">ﾄ</text>
  </g>

  <!-- Der Schriftzug mitten im Regen -->
  <text x="400" y="320" class="oracle-text">Temet Nosce</text>

  <g class="stream" style="animation-duration: 5.0s; animation-delay: 1.2s;">
    <text x="360" y="50" class="glow" opacity="0.4">ﾅ</text>
    <text x="360" y="80" class="glow" opacity="0.6">ﾆ</text>
    <text x="360" y="110" class="glow" opacity="0.8">ﾇ</text>
    <text x="360" y="140" class="glow bright">ﾈ</text>
  </g>

  <g class="stream" style="animation-duration: 2.9s; animation-delay: 0.3s;">
    <text x="440" y="30" class="glow" opacity="0.3">ﾊ</text>
    <text x="440" y="60" class="glow" opacity="0.6">ﾋ</text>
    <text x="440" y="90" class="glow" opacity="0.8">ﾌ</text>
    <text x="440" y="120" class="glow bright">ﾍ</text>
  </g>

  <g class="stream" style="animation-duration: 6.2s; animation-delay: 1.8s;">
    <text x="520" y="70" class="glow" opacity="0.5">ﾏ</text>
    <text x="520" y="100" class="glow" opacity="0.7">ﾐ</text>
    <text x="520" y="130" class="glow" opacity="0.9">ﾑ</text>
    <text x="520" y="160" class="glow bright">ﾒ</text>
  </g>

  <g class="stream" style="animation-duration: 4.1s; animation-delay: 0.9s;">
    <text x="600" y="20" class="glow" opacity="0.4">ﾔ</text>
    <text x="600" y="50" class="glow" opacity="0.7">ﾕ</text>
    <text x="600" y="80" class="glow" opacity="0.9">ﾖ</text>
    <text x="600" y="110" class="glow bright">ﾗ</text>
  </g>

  <g class="stream" style="animation-duration: 5.2s; animation-delay: 2.7s;">
    <text x="680" y="40" class="glow" opacity="0.3">ﾘ</text>
    <text x="680" y="70" class="glow" opacity="0.5">ﾙ</text>
    <text x="680" y="100" class="glow" opacity="0.8">ﾚ</text>
    <text x="680" y="130" class="glow bright">ﾛ</text>
  </g>

  <g class="stream" style="animation-duration: 3.5s; animation-delay: 1.1s;">
    <text x="760" y="80" class="glow" opacity="0.5">ﾜ</text>
    <text x="760" y="110" class="glow" opacity="0.7">ﾝ</text>
    <text x="760" y="140" class="glow" opacity="0.9">ｦ</text>
    <text x="760" y="170" class="glow bright">ｱ</text>
  </g>
</svg>
